name: Deploy Web UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Verify generated assets
        working-directory: web
        run: |
          npm run fonts:generate
          npm run map:generate
          npm run rail:generate
          git diff --exit-code -- src/generated public/data
      - name: Rust geometry tests
        working-directory: web
        run: cargo test --manifest-path wasm/geo-core/Cargo.toml
      - name: Test
        working-directory: web
        run: |
          npm run test
          npm audit --omit=dev --audit-level=high
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
