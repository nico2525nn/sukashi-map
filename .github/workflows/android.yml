name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/verify-release-signing.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/verify-release-signing.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Rust geometry tests
        run: cargo test --manifest-path web/wasm/geo-core/Cargo.toml

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          SUKASHI_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SUKASHI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUKASHI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUKASHI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Verify release certificate
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          SUKASHI_RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: bash scripts/verify-release-signing.sh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: sukashi-map-release-apk
          path: app/build/outputs/apk/release/app-release.apk
